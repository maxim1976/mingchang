{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <title>{% block title %}花蓮糕餅店 Hualien Pastry Shop{% endblock %}</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="{% block meta_description %}來自花蓮之心的手作美味 - Handcrafted Delights from the Heart of Hualien{% endblock %}">
    <meta name="keywords" content="花蓮,伴手禮,糕餅,太陽餅,鳳梨酥,牛軋糖,麻糬,Hualien,souvenirs,pastries,sun cake,pineapple cake,nougat,mochi">
    <meta name="author" content="Hualien Pastry Shop">
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="{% block og_title %}花蓮糕餅店 Hualien Pastry Shop{% endblock %}">
    <meta property="og:description" content="{% block og_description %}來自花蓮之心的手作美味{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    {% block og_image %}{% endblock %}
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ee652b",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221510",
                        "text-light": "#181311",
                        "text-dark": "#f8f6f6",
                        "subtext-light": "#896d61",
                        "subtext-dark": "#a1918a",
                        "surface-light": "#ffffff",
                        "surface-dark": "#2d1b14",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"],
                        "serif": ["Noto Serif TC", "serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                }
            }
        }
    </script>
    
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    
    <!-- HTMX -->
    <script src="{% static 'js/htmx.min.js' %}" defer></script>
    
    <!-- Alpine.js -->
    <script src="{% static 'js/alpine.min.js' %}" defer></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">    
    <!-- Navbar -->
    {% include 'components/navbar.html' %}
    
    <!-- Main Content -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    {% include 'components/footer.html' %}
    
    {% block extra_js %}{% endblock %}
</body>
</html>
