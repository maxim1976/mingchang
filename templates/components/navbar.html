{% load static %}
<header class="w-full sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm" x-data="{ mobileMenuOpen: false }">
    <div class="mx-auto flex max-w-7xl items-center justify-between whitespace-nowrap border-b border-solid border-b-[#f4f1f0] dark:border-b-surface-dark px-4 sm:px-6 lg:px-8 py-3">
        <div class="flex items-center gap-4 text-text-light dark:text-text-dark">
            <a href="{% url 'shop:home' %}" class="flex items-center gap-4">
                <div class="size-6 text-primary">
                    <svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path d="M4 4H17.3334V17.3334H30.6666V30.6666H44V44H4V4Z" fill="currentColor"></path></svg>
                </div>
                <h2 class="text-lg font-bold tracking-[-0.015em] font-serif">Hualien Pastry Shop</h2>
            </a>
        </div>
        <div class="hidden md:flex flex-1 justify-end gap-8">
            <nav class="flex items-center gap-9">
                <a class="text-sm font-medium leading-normal text-text-light dark:text-text-dark hover:text-primary dark:hover:text-primary" href="{% url 'shop:home' %}">首頁 Home</a>
                <a class="text-sm font-medium leading-normal text-text-light dark:text-text-dark hover:text-primary dark:hover:text-primary" href="{% url 'shop:product_list' %}">產品 Products</a>
                <a class="text-sm font-medium leading-normal text-text-light dark:text-text-dark hover:text-primary dark:hover:text-primary" href="{% url 'shop:about' %}">關於我們 About Us</a>
                <a class="text-sm font-medium leading-normal text-text-light dark:text-text-dark hover:text-primary dark:hover:text-primary" href="{% url 'contact:contact' %}">聯絡我們 Contact</a>
            </nav>
            <button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-opacity-90 transition-colors">
                <span class="truncate">立即購買 Shop Now</span>
            </button>
        </div>
        <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden flex items-center justify-center rounded-lg h-10 w-10 text-text-light dark:text-text-dark">
            <span class="material-symbols-outlined">menu</span>
        </button>
    </div>
    
    <!-- Mobile Navigation -->
    <div x-show="mobileMenuOpen" x-transition class="md:hidden bg-background-light dark:bg-background-dark border-b border-solid border-b-[#f4f1f0] dark:border-b-surface-dark">
        <nav class="flex flex-col px-4 py-2">
            <a href="{% url 'shop:home' %}" class="py-3 text-sm font-medium text-text-light dark:text-text-dark hover:text-primary">首頁 Home</a>
            <a href="{% url 'shop:product_list' %}" class="py-3 text-sm font-medium text-text-light dark:text-text-dark hover:text-primary">產品 Products</a>
            <a href="{% url 'shop:about' %}" class="py-3 text-sm font-medium text-text-light dark:text-text-dark hover:text-primary">關於我們 About Us</a>
            <a href="{% url 'contact:contact' %}" class="py-3 text-sm font-medium text-text-light dark:text-text-dark hover:text-primary">聯絡我們 Contact</a>
        </nav>
    </div>
</header>
